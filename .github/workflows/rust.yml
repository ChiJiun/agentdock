name: Rust

# P1-3 (docs/tasks/P1-3-windows-ci.md). Job names must NOT be `check`:
# that name is the required check of the "Protect main" ruleset (frontend.yml).
# No `paths:` filters on purpose, so these jobs can become required checks later (#55).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      # Tauri 2 Linux build packages (runner only). Not needed until src-tauri lands (P1-2),
      # kept here so the P1-2 PR does not need a second workflow change.
      - name: Tauri system packages (runner only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev
      # rustup >= 1.28 no longer installs the toolchain on `rustup show`; this reads rust-toolchain.toml.
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Tauri's generate_context! embeds ../dist, so build the frontend first.
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  rust-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # `npm run build` is added to the packet's command list: once agentdock-desktop is in the
      # workspace, clippy/test compile it and generate_context! needs ../dist on Windows too.
      - run: npm ci
      - run: npm run build
      # All #[cfg(windows)] tests run here.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # TODO(P1-2 follow-up PR): `npm run tauri build -- --debug --no-bundle` and the
      # two-launch smoke step (packet P1-3 section 4) are added after src-tauri merges.

  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2
        with:
          command: check
