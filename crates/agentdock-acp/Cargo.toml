[package]
name = "agentdock-acp"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# ADR-0002 section 3: exact pin; no features. In particular NOT `process` (kills only the direct
# child on Windows and pulls in async-process/async-io) and NOT `stdio`.
agent-client-protocol = { version = "=5.6.1", default-features = false }
futures = { version = "0.3", default-features = false, features = ["std"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["io-util"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "rt"] }
