[workspace]
resolver = "2"
members = ["crates/agentdock-acp", "crates/agentdock-core", "src-tauri"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"   # license not decided (ADR-0002 §5); keep UNLICENSED and publish = false
publish = false
