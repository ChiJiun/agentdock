    .box { fill: #ffffff; stroke: #9aa3b0; stroke-width: 1; }
    .sunk { fill: #eef0f3; stroke: #c4cad3; }
    .line { stroke: #c4cad3; stroke-width: 1; }
    .sel { fill: #dcefec; stroke: #0a6b66; stroke-width: 1.5; }
    .acc { fill: #0a6b66; } .acct { fill: #ffffff; font-weight: 600; }
    .warn { fill: #fbebd6; stroke: #8f4e00; stroke-width: 2; }
    .dash { fill: none; stroke: #7a8394; stroke-dasharray: 5 4; }
    .co circle { fill: #151a22; } .co text { fill: #ffffff; font-size: 12px; font-weight: 700; text-anchor: middle; }
    .ph { fill: #d5dae1; }
  </style>
