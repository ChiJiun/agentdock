<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 940" width="1440" height="940" role="img" aria-labelledby="t d">
  <title id="t">AgentDock desktop wireframe, 3 columns (wide layout, 1280px and up)</title>
  <desc id="d">Top bar with switcher trigger, usage and inbox; left sidebar with pinned and project groups and nested sub-tasks; main session column with header, timeline, approval card and composer with suggestions; right review panel with changes, checks and findings. Numbered callouts map to docs/ux/wireframes.md.</desc>
